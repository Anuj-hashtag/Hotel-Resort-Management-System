<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in and Check-out - Hotel Paradise</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/staff.css">
</head>
<body>
    <header class="navbar">
        <div class="container"><div class="logo">Hotel Paradise - Staff</div></div>
    </header>

    <section class="section">
        <div class="container">
            <div class="staff-nav">
                <a href="dashboard.html">Dashboard</a>
                <a href="reservations.html">Reservations</a>
                <a href="rooms.html">Rooms</a>
                <a href="guests.html">Guests</a>
                <a href="checkin-checkout.html">Check-in / Check-out</a>
                <a href="../index.html">Main Website</a>
            </div>

            <h1>Check-in / Check-out</h1>
            <p>This page represents the staff workflow for recording guest arrival and departure information.</p>

            <div class="form-box">
                <h2>Stay Record</h2>
                <form>
                    <div class="two-column">
                        <div class="form-group">
                            <label for="booking">Booking ID</label>
                            <input id="booking" type="text" required>
                        </div>
                        <div class="form-group">
                            <label for="guest">Guest Name</label>
                            <input id="guest" type="text" required>
                        </div>
                    </div>
                    <div class="two-column">
                        <div class="form-group">
                            <label for="checkin">Check-in Date</label>
                            <input id="checkin" type="date" required>
                        </div>
                        <div class="form-group">
                            <label for="checkout">Check-out Date</label>
                            <input id="checkout" type="date" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="status">Stay Status</label>
                        <select id="status" required>
                            <option value="">Select status</option>
                            <option>Checked In</option>
                            <option>Checked Out</option>
                        </select>
                    </div>
                    <button class="btn" type="submit">Save Stay Information</button>
                </form>
            </div>
        </div>
    </section>
</body>
</html>
