<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Hotel Paradise</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">Hotel Paradise</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="booking/rooms.html">Rooms</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </div>
    </nav>

    <header class="page-header">
        <div class="container">
            <h1>Contact Us</h1>
            <p>Send a message to Hotel Paradise.</p>
        </div>
    </header>

    <section class="section">
        <div class="container">
            <div class="form-box">
                <h2>Send us a message</h2>
                <form>
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input id="name" type="text" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input id="email" type="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" rows="6" required></textarea>
                    </div>
                    <button class="btn" type="submit">Send Message</button>
                </form>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div><strong>Hotel Paradise</strong><p>Hotel and Resort Management System</p></div>
            <div><p>Email: info@hotelparadise.com</p><p>Phone: +91 98765 43210</p></div>
        </div>
    </footer>
</body>
</html>
