<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking - Hotel Paradise</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">Hotel Paradise</div>
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="rooms.html">Rooms</a></li>
                <li><a href="booking.html">Book</a></li>
                <li><a href="../services.html">Services</a></li>
                <li><a href="../contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>

    <header class="page-header">
        <div class="container">
            <h1>Book Your Room</h1>
            <p>Enter guest and reservation information.</p>
        </div>
    </header>

    <section class="section">
        <div class="container">
            <div class="form-box">
                <h2>Reservation Form</h2>
                <form action="booking-confirmation.html">
                    <div class="two-column">
                        <div class="form-group">
                            <label for="name">Full Name</label>
                            <input id="name" type="text" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input id="email" type="email" required>
                        </div>
                    </div>

                    <div class="two-column">
                        <div class="form-group">
                            <label for="phone">Phone</label>
                            <input id="phone" type="tel" required>
                        </div>
                        <div class="form-group">
                            <label for="room">Room Type</label>
                            <select id="room" required>
                                <option value="">Select room</option>
                                <option>Standard Room</option>
                                <option>Deluxe Room</option>
                                <option>Suite Room</option>
                            </select>
                        </div>
                    </div>

                    <div class="two-column">
                        <div class="form-group">
                            <label for="checkin">Check-in</label>
                            <input id="checkin" type="date" required>
                        </div>
                        <div class="form-group">
                            <label for="checkout">Check-out</label>
                            <input id="checkout" type="date" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="guests">Number of Guests</label>
                        <input id="guests" type="number" min="1" max="6" required>
                    </div>

                    <button class="btn" type="submit">Confirm Booking</button>
                </form>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div><strong>Hotel Paradise</strong><p>Hotel and Resort Management System</p></div>
            <div><p>Email: info@hotelparadise.com</p><p>Phone: +91 98765 43210</p></div>
        </div>
    </footer>
</body>
</html>
